name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Job name kept as "Go" so existing branch-protection required checks continue to match.
  go:
    name: Go
    runs-on: ubuntu-latest
    env:
      GOTOOLCHAIN: auto
    steps:
      - uses: actions/checkout@v4

      # Install the go.mod toolchain line (go1.27.2), not only the language
      # `go 1.24.4` directive. setup-go's go-version-file reads the language
      # version; with GOTOOLCHAIN=auto, `go run govulncheck@…` then built the
      # scanner on go1.26.9 and failed to load the go1.27.2 stdlib (ADR-011).
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
          cache-dependency-path: go.sum

      # web/embed.go uses //go:embed all:dist — dist must exist before go vet/test.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify
        run: make verify
