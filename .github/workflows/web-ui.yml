name: Web UI

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ui.yml'
      - 'Makefile'
  pull_request:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/web-ui.yml'
      - 'Makefile'

permissions:
  contents: read

# Separate from the Go verify job so Playwright browser install does not slow Go tests.
jobs:
  playwright:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium (Playwright)
        run: npx playwright install chromium --with-deps

      - name: Unit / contract tests
        run: npm test

      - name: Browser tests (no baseline updates)
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
