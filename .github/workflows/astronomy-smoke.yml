# LIVE SMOKE — optional Astronomy Shop stack on a GitHub-hosted runner.
# workflow_dispatch only. NOT a required PR check. No schedule until stability
# and cost are measured (Milestone C.5 / issue #26).
#
# Modes:
#   smoke       — existing readiness + trace + Run Pulse API smoke
#   live-fault  — Live Pulse baseline → shipping latency fault → incident → recovery
name: Astronomy Smoke

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type run to start the isolated Astronomy Shop smoke (expensive)'
        required: true
        default: ''
      mode:
        description: 'smoke (default readiness/Run Pulse) or live-fault (Live Pulse fault lifecycle)'
        required: true
        default: 'smoke'
        type: choice
        options:
          - smoke
          - live-fault

permissions:
  contents: read

concurrency:
  group: astronomy-smoke-${{ github.repository }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Live Astronomy Shop
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: github.event.inputs.confirm == 'run' && github.event.inputs.mode == 'smoke'
    env:
      GOTOOLCHAIN: auto
      ASTRONOMY_DEMO_PIN: '3.1.0'
      ASTRONOMY_MODE: minimal
      ASTRONOMY_VERIFY_WAIT_SECS: '300'
      ASTRONOMY_SMOKE_DEADLINE_SECS: '2400'
      ASTRONOMY_MIN_DISK_KB: '8388608'
      ASTRONOMY_MIN_MEM_KB: '3145728'
      ASTRONOMY_SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/examples/astronomy-shop/.smoke-artifacts
      # Bounded multi-service trace probe (recommendations browse → Jaeger).
      ASTRONOMY_TRACE_DEADLINE_SECS: '120'
      ASTRONOMY_TRACE_POLL_SECS: '3'
      ASTRONOMY_TRACE_MAX_REQUESTS: '5'
      ASTRONOMY_TRACE_REQUEST_TIMEOUT_SECS: '15'
      ASTRONOMY_TRACE_PRODUCT_ID: 'OLJCESPC7Z'
      # Run Pulse HTTP API stage (POST/GET /api/pulse/runs against real viz).
      ASTRONOMY_RUN_PULSE_DEADLINE_SECS: '120'
      ASTRONOMY_RUN_PULSE_POLL_SECS: '2'
      ASTRONOMY_RUN_PULSE_MAX_ATTEMPTS: '60'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Preflight runner resources
        run: |
          set -euo pipefail
          df -h /
          free -m || true
          docker version
          avail_kb="$(df -k / | awk 'NR==2{print $4}')"
          mem_kb="$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)"
          echo "disk_avail_kb=$avail_kb mem_available_kb=$mem_kb"
          if [[ "$avail_kb" -lt "$ASTRONOMY_MIN_DISK_KB" ]]; then
            echo "::error::Insufficient disk for Astronomy Shop (avail_kb=$avail_kb). Do not claim success; larger runners need approval."
            exit 1
          fi
          if [[ "$mem_kb" -lt "$ASTRONOMY_MIN_MEM_KB" ]]; then
            echo "::error::Insufficient MemAvailable (mem_kb=$mem_kb). Smoke unavailable on this runner class."
            exit 1
          fi

      - name: Build perch (embed UI required by //go:embed)
        run: |
          mkdir -p examples/astronomy-shop/.smoke-artifacts
          make web-deps web-build-embed
          go build -o examples/astronomy-shop/.smoke-artifacts/perch ./cmd/perch

      - name: Run isolated smoke
        run: |
          mkdir -p examples/astronomy-shop/.smoke-artifacts
          chmod +x examples/astronomy-shop/scripts/ci-smoke.sh
          export PERCH_BIN="${{ github.workspace }}/examples/astronomy-shop/.smoke-artifacts/perch"
          ./examples/astronomy-shop/scripts/ci-smoke.sh

      - name: Upload smoke artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astronomy-smoke-${{ github.run_id }}
          path: examples/astronomy-shop/.smoke-artifacts
          if-no-files-found: ignore
          retention-days: 7

  live-fault:
    name: Live Pulse Fault Lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 50
    if: github.event.inputs.confirm == 'run' && github.event.inputs.mode == 'live-fault'
    env:
      GOTOOLCHAIN: auto
      ASTRONOMY_DEMO_PIN: '3.1.0'
      ASTRONOMY_MODE: minimal
      ASTRONOMY_VERIFY_WAIT_SECS: '300'
      ASTRONOMY_LIVE_FAULT_DEADLINE_SECS: '2700'
      ASTRONOMY_MIN_DISK_KB: '8388608'
      ASTRONOMY_MIN_MEM_KB: '3145728'
      ASTRONOMY_SMOKE_ARTIFACT_DIR: ${{ github.workspace }}/examples/astronomy-shop/.smoke-artifacts/live-fault
      # Live Pulse fault windows (bounded). DemoDetectConfig baseline ~2m.
      ASTRONOMY_LIVE_FAULT_SCENARIO: 'latency-shipping-intl'
      ASTRONOMY_LIVE_FAULT_SERVICE: 'astronomy/local/shipping'
      ASTRONOMY_LIVE_FAULT_GRAPH_NODE: 'shipping'
      ASTRONOMY_LIVE_FAULT_BASELINE_SECS: '180'
      ASTRONOMY_LIVE_FAULT_FAULT_SECS: '150'
      ASTRONOMY_LIVE_FAULT_RECOVER_SECS: '150'
      ASTRONOMY_LIVE_FAULT_POLL_SECS: '10'
      PERCH_LIVE_PULSE_PROM_URL: 'http://127.0.0.1:9090'
      PERCH_LIVE_PULSE_POLL_INTERVAL: '15s'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.2'
          cache: true
          cache-dependency-path: go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Preflight runner resources
        run: |
          set -euo pipefail
          df -h /
          free -m || true
          docker version
          avail_kb="$(df -k / | awk 'NR==2{print $4}')"
          mem_kb="$(awk '/MemAvailable:/ {print $2}' /proc/meminfo)"
          echo "disk_avail_kb=$avail_kb mem_available_kb=$mem_kb"
          if [[ "$avail_kb" -lt "$ASTRONOMY_MIN_DISK_KB" ]]; then
            echo "::error::Insufficient disk for live fault (avail_kb=$avail_kb)."
            exit 1
          fi
          if [[ "$mem_kb" -lt "$ASTRONOMY_MIN_MEM_KB" ]]; then
            echo "::error::Insufficient MemAvailable (mem_kb=$mem_kb)."
            exit 1
          fi

      - name: Build perch
        run: |
          mkdir -p examples/astronomy-shop/.smoke-artifacts/live-fault
          make web-deps web-build-embed
          go build -o examples/astronomy-shop/.smoke-artifacts/live-fault/perch ./cmd/perch

      - name: Run live fault lifecycle
        run: |
          chmod +x examples/astronomy-shop/scripts/ci-live-fault.sh
          export PERCH_BIN="${{ github.workspace }}/examples/astronomy-shop/.smoke-artifacts/live-fault/perch"
          ./examples/astronomy-shop/scripts/ci-live-fault.sh

      - name: Upload live-fault artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astronomy-live-fault-${{ github.run_id }}
          path: examples/astronomy-shop/.smoke-artifacts/live-fault
          if-no-files-found: ignore
          retention-days: 7
